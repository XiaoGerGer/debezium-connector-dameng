name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      database_tests:
        description: Run database tests on a prepared dameng runner
        type: boolean
        default: false
      dameng_image:
        description: Locally loaded vendor DM image on the prepared runner
        type: string
        default: dameng:8.1.3.162-20240621-rev232765
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build pinned upstream dependencies
        run: .github/scripts/build-debezium.sh "$RUNNER_TEMP/debezium-core"
      - name: Verify formatting, unit tests, architecture and archives
        run: ./mvnw -B -ntp clean verify -Passembly -Dformat.formatter.goal=validate -Dformat.imports.goal=check
      - name: Inspect plugin archives
        run: python3 .github/scripts/verify-plugin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: target/surefire-reports/
  database:
    if: github.event_name == 'workflow_dispatch' && inputs.database_tests
    runs-on: [self-hosted, linux, x64, dameng]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check prepared database image
        env:
          DM_IMAGE: ${{ inputs.dameng_image }}
        run: docker image inspect "$DM_IMAGE" > /dev/null
      - name: Build pinned upstream dependencies
        run: .github/scripts/build-debezium.sh "$RUNNER_TEMP/debezium-core-${{ github.run_id }}"
      - name: Database regression
        env:
          DM_IMAGE: ${{ inputs.dameng_image }}
        run: ./mvnw -B -ntp clean verify -Pdameng-tests -Ddameng.failsafe.reports.directory=target/failsafe-database-reports -Ddameng.image="$DM_IMAGE"
      - name: Packaged Connect regression
        env:
          DM_IMAGE: ${{ inputs.dameng_image }}
        run: ./mvnw -B -ntp verify -Pdameng-connect-tests,assembly -Ddameng.failsafe.reports.directory=target/failsafe-connect-reports -Ddameng.image="$DM_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-reports
          path: |
            target/surefire-reports/
            target/failsafe-*-reports/
